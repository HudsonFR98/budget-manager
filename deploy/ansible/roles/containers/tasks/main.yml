---
# Container management tasks

- name: Stop and remove existing containers
  docker_container:
    name: "{{ item }}"
    state: absent
  with_items:
    - "{{ container_name }}"
    - "{{ nginx_container_name }}"
    - "redis"
  ignore_errors: yes

- name: Stop and remove database and redis containers (only for deploy action)
  docker_container:
    name: "{{ item }}"
    state: absent
  with_items:
    - "db"
    - "redis"
  ignore_errors: yes
  when: action == 'deploy'

- name: Create Docker network
  community.docker.docker_network:
    name: fair3r_custom_overlay_network
    state: present

- name: Debug docker registry info
  debug:
    msg: "Using docker registry: {{ docker_registry }}"

- name: Pull PostgreSQL Docker image
  docker_image:
    name: "{{ docker_registry }}/postgres:16"
    source: pull
    force_source: yes

- name: Run PostgreSQL Docker container
  docker_container:
    name: db
    image: "{{ docker_registry }}/postgres:16"
    state: started
    restart_policy: always
    ports:
      - "5432:5432"
    env:
      POSTGRES_USER: web
      POSTGRES_PASSWORD: fco2025_x
      POSTGRES_DB: postgres
    volumes:
      - /opt/fair3r_custom_overlay_data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /opt/fair3r_custom_overlay_data/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    command: postgres -c 'max_connections=100'
    networks:
      - name: fair3r_custom_overlay_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  when: action == 'deploy'

- name: Wait for database container to be healthy
  docker_container_info:
    name: db
  register: db_info
  until: db_info.container.State.Health.Status == "healthy"
  retries: 10
  delay: 3
  when: action == 'deploy'

- name: Pull Redis Docker image
  docker_image:
    name: "{{ docker_registry }}/redis:7-alpine"
    source: pull
    force_source: yes

- name: Run Redis Docker container
  docker_container:
    name: redis
    image: "{{ docker_registry }}/redis:7-alpine"
    state: started
    restart_policy: always
    networks:
      - name: fair3r_custom_overlay_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
  when: action == 'deploy'

- name: Wait for Redis container to be healthy
  docker_container_info:
    name: redis
  register: redis_info
  until: redis_info.container.State.Health.Status == "healthy"
  retries: 10
  delay: 3
  when: action == 'deploy'

- name: Check if database and redis containers exist and are running (for updates)
  docker_container_info:
    name: "{{ item }}"
  register: "{{ item }}_container_info"
  with_items:
    - db
    - redis
  when: action == 'update'

- name: Fail if database container is not running during update
  fail:
    msg: "Database container 'db' is not running. Please ensure it exists and is healthy before updating."
  when: action == 'update' and (db_container_info.exists is not defined or not db_container_info.exists or db_container_info.container.State.Status != 'running')

- name: Fail if redis container is not running during update
  fail:
    msg: "Redis container 'redis' is not running. Please ensure it exists and is healthy before updating."
  when: action == 'update' and (redis_container_info.exists is not defined or not redis_container_info.exists or redis_container_info.container.State.Status != 'running')

- name: Wait for existing database container to be healthy (for updates)
  docker_container_info:
    name: db
  register: db_info
  until: db_info.container.State.Health.Status == "healthy"
  retries: 10
  delay: 3
  when: action == 'update'

- name: Wait for existing redis container to be healthy (for updates)
  docker_container_info:
    name: redis
  register: redis_info
  until: redis_info.container.State.Health.Status == "healthy"
  retries: 10
  delay: 3
  when: action == 'update'

- name: Pull Docker image
  docker_image:
    name: "{{ docker_image }}"
    source: pull
    force_source: yes

- name: Run App Docker container
  docker_container:
    name: "{{ container_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: always
    # No external port mapping - only accessible via Nginx
    env:
      FAIR3R_CUSTOM_OVERLAY_CONTEXT: "{{ context }}"
      DB_IP: db
      BUILD_DATE: "{{ ansible_date_time.iso8601 | regex_replace('T', '.') | regex_replace(':', '.') | regex_replace('-', '.') | regex_replace('Z', '') }}"
    volumes:
      - /var/log/fair3r_custom_overlay:/var/log/fair3r_custom_overlay
      - /opt/fair3r_custom_overlay_data:/opt/fair3r_custom_overlay_data
    networks:
      - name: fair3r_custom_overlay_network
    network_mode: bridge
    dns_servers:
      - 8.8.8.8
      - 8.8.4.4

- name: Wait for app container to be ready
  docker_container_info:
    name: "{{ container_name }}"
  register: app_info
  until: app_info.container.State.Status == "running"
  retries: 10
  delay: 3

- name: Pull Nginx Docker image
  docker_image:
    name: "{{ docker_registry }}/nginx:alpine"
    source: pull
    force_source: yes

- name: Run Nginx container
  docker_container:
    name: "{{ nginx_container_name }}"
    image: "{{ docker_registry }}/nginx:alpine"
    state: started
    restart_policy: always
    ports:
      - "80:80"
    volumes:
      - /opt/fair3r_custom_overlay_data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - name: fair3r_custom_overlay_network 