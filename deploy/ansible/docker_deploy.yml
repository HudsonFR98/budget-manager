---
# Ansible playbook to deploy fair3r_custom_overlay using Docker


- name: Deploy fair3r_custom_overlay using Docker
  hosts: "{{ target_host }}"
  remote_user: devics
  become: yes
  vars:
    action: "{{ action | default('deploy') }}"
    context: "{{ context | default('demo') }}"
    docker_image: "{{ docker_image }}"
    container_name: "fair3r_custom_overlay_{{ context }}"
    nginx_container_name: "nginx_{{ context }}"
    db_host: "{{ db_host | default('localhost') }}"

  tasks:
    - name: Install Docker dependencies
      apt:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
        state: present
        update_cache: yes

    - name: Install PostgreSQL client
      apt:
        name: postgresql-client
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/debian bullseye stable
        state: present

    - name: Install Docker
      apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Create necessary directories
      file:
        path: "{{ item }}"
        state: directory
        owner: devics
        group: devics
        mode: '0755'
      with_items:
        - /var/log/fair3r_custom_overlay
        - /opt/fair3r_custom_overlay_data
        - /var/log/nginx
        - /etc/letsencrypt
        - /var/www/html

    - name: Set log directory permissions for Docker container
      file:
        path: /var/log/fair3r_custom_overlay
        state: directory
        owner: "1000"  # UID of web user in container
        group: "1000"  # GID of web user in container
        mode: '0775'
        recurse: yes

    - name: Create log file with correct permissions
      file:
        path: /var/log/fair3r_custom_overlay/fair3r_custom_overlay.log
        state: touch
        owner: "1000"
        group: "1000"
        mode: '0664'

    - name: Set data directory permissions for Docker container
      file:
        path: /opt/fair3r_custom_overlay_data
        state: directory
        owner: "1000"  # UID of web user in container
        group: "1000"  # GID of web user in container
        mode: '0775'
        recurse: yes

    - name: Set Nginx log directory permissions
      file:
        path: /var/log/nginx
        state: directory
        owner: "101"  # Nginx user
        group: "101"  # Nginx group
        mode: '0775'
        recurse: yes

    - name: Log in to GitLab Container Registry
      docker_login:
        registry: "{{ docker_registry }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"
        state: present

    - name: Copy init-db.sh script to remote
      copy:
        src: ../init-db.sh
        dest: /opt/fair3r_custom_overlay_data/init-db.sh
        mode: '0755'

    - name: Copy reset.sql script to remote
      copy:
        src: ../../fair3r_custom_overlay/tests/reset.sql
        dest: /opt/fair3r_custom_overlay_data/init.sql
        mode: '0644'

    - name: Copy Nginx configuration
      copy:
        src: "../nginx_{{ context }}.conf"
        dest: "/opt/fair3r_custom_overlay_data/nginx.conf"
        mode: '0644'

    - name: Stop and remove existing containers
      docker_container:
        name: "{{ item }}"
        state: absent
      with_items:
        - "{{ container_name }}"
        - "{{ nginx_container_name }}"
      ignore_errors: yes

    - name: Stop and remove database container (only for deploy action)
      docker_container:
        name: "db"
        state: absent
      ignore_errors: yes
      when: action == 'deploy'

    - name: Create Docker network
      community.docker.docker_network:
        name: fair3r_custom_overlay_network
        state: present

    - name: Run PostgreSQL Docker container
      docker_container:
        name: db
        image: postgres:16
        state: started
        restart_policy: always
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: web
          POSTGRES_PASSWORD: fco2025_x
          POSTGRES_DB: postgres
        volumes:
          - /opt/fair3r_custom_overlay_data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
          - /opt/fair3r_custom_overlay_data/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
        command: postgres -c 'max_connections=100'
        networks:
          - name: fair3r_custom_overlay_network
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
          interval: 5s
          timeout: 5s
          retries: 5
      when: action == 'deploy'

    - name: Wait for database container to be healthy
      docker_container_info:
        name: db
      register: db_info
      until: db_info.container.State.Health.Status == "healthy"
      retries: 10
      delay: 3
      when: action == 'deploy'

    - name: Check if database container exists and is running (for updates)
      docker_container_info:
        name: db
      register: db_container_info
      when: action == 'update'

    - name: Fail if database container is not running during update
      fail:
        msg: "Database container 'db' is not running. Please ensure it exists and is healthy before updating."
      when: action == 'update' and (db_container_info.exists is not defined or not db_container_info.exists or db_container_info.container.State.Status != 'running')

    - name: Wait for existing database container to be healthy (for updates)
      docker_container_info:
        name: db
      register: db_info
      until: db_info.container.State.Health.Status == "healthy"
      retries: 10
      delay: 3
      when: action == 'update'

    - name: Pull Docker image
      docker_image:
        name: "{{ docker_image }}"
        source: pull
        force_source: yes

    - name: Run App Docker container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        # No external port mapping - only accessible via Nginx
        env:
          FAIR3R_CUSTOM_OVERLAY_CONTEXT: "{{ context }}"
          DB_IP: db
          BUILD_DATE: "{{ ansible_date_time.iso8601 | regex_replace('T', '.') | regex_replace(':', '.') | regex_replace('-', '.') | regex_replace('Z', '') }}"
        volumes:
          - /var/log/fair3r_custom_overlay:/var/log/fair3r_custom_overlay
          - /opt/fair3r_custom_overlay_data:/opt/fair3r_custom_overlay_data
        networks:
          - name: fair3r_custom_overlay_network
        network_mode: bridge
        dns_servers:
          - 8.8.8.8
          - 8.8.4.4

    - name: Wait for app container to be ready
      docker_container_info:
        name: "{{ container_name }}"
      register: app_info
      until: app_info.container.State.Status == "running"
      retries: 10
      delay: 3

    - name: Wait for app container port to be listening
      shell: |
        docker exec {{ container_name }} timeout 10 bash -c 'until netstat -tlnp | grep :8080 > /dev/null; do sleep 2; done'
      register: port_check_result
      retries: 15
      delay: 3
      until: port_check_result.rc == 0

    - name: Run Nginx container
      docker_container:
        name: "{{ nginx_container_name }}"
        image: nginx:alpine
        state: started
        restart_policy: always
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - /opt/fair3r_custom_overlay_data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
          - /var/log/nginx:/var/log/nginx
          - /etc/letsencrypt:/etc/letsencrypt:ro
          - /var/www/html:/var/www/html:ro
        networks:
          - name: fair3r_custom_overlay_network
        depends_on:
          - "{{ container_name }}"

    - name: Install certbot for SSL certificates
      apt:
        name: 
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Obtain SSL certificate for demo environment
      command: >
        certbot certonly --webroot 
        --webroot-path=/var/www/html 
        --email debannen@igbmc.fr 
        --agree-tos --no-eff-email 
        --domains serv-ics-fco-d-01
      when: context == 'demo' and action == 'deploy'
      register: certbot_result
      ignore_errors: yes

    - name: Obtain SSL certificate for test environment
      command: >
        certbot certonly --webroot 
        --webroot-path=/var/www/html 
        --email debannen@igbmc.fr 
        --agree-tos --no-eff-email 
        --domains serv-ics-fco-t-01
      when: context == 'test' and action == 'deploy'
      register: certbot_result
      ignore_errors: yes

    - name: Obtain SSL certificate for production environment
      command: >
        certbot certonly --webroot 
        --webroot-path=/var/www/html 
        --email debannen@igbmc.fr 
        --agree-tos --no-eff-email 
        --domains serv-ics-fco-p-01
      when: context == 'prod' and action == 'deploy'
      register: certbot_result
      ignore_errors: yes

    - name: Show certbot result
      debug:
        msg: "{{ certbot_result.stdout_lines }}"
      when: certbot_result is defined and certbot_result.rc == 0

    - name: Show certbot errors if any
      debug:
        msg: "{{ certbot_result.stderr_lines }}"
      when: certbot_result is defined and certbot_result.rc != 0

    - name: Verify network connectivity
      shell: |
        docker exec {{ container_name }} curl -I http://db:5432
      register: curl_result
      changed_when: false
      failed_when: false

    - name: Show network connectivity result
      debug:
        msg: "{{ curl_result.stdout_lines }}"
      when: curl_result.rc != 0

    - name: Run pytest in test container
      community.docker.docker_container_exec:
        container: "{{ container_name }}"
        command: >
          bash -c "FAIR3R_CUSTOM_OVERLAY_CONTEXT=test DB_IP=db
          /opt/env3/fair3r_custom_overlay/bin/python
          fair3r_custom_overlay/tests/run_tests.py"
      register: pytest_result
      when: context == 'test'

    - name: Show pytest output
      debug:
        msg: "{{ pytest_result.stdout_lines }}"
      when: context == 'test'

    - name: Show pytest errors if any
      debug:
        msg: "{{ pytest_result.stderr_lines }}"
      when: context == 'test' and pytest_result.stderr_lines | length > 0

    - name: Fail if tests fail
      fail:
        msg: "Tests failed with exit code {{ pytest_result.rc }}"
      when: context == 'test' and pytest_result.rc != 0