---
# Ansible playbook to deploy fair3r_custom_overlay
# Replaces the functionality of fabfile.py

- name: Deploy fair3r_custom_overlay
  hosts: "{{ target_host }}"
  remote_user: devics
  become: no
  vars:
    action: "{{ action | default('deploy') }}"
    context: "{{ context | default('demo') }}"
  
  tasks:
    - name: Find distribution package
      find:
        paths: "{{ playbook_dir }}/../../dist"
        patterns: "*.tar.gz"
      register: dist_files
      delegate_to: localhost
    
    - name: Set tarball name
      set_fact:
        tarball: "{{ dist_files.files[0].path | basename }}"
      when: dist_files.files | length > 0
    
    - name: Copy distribution package to remote server
      copy:
        src: "{{ playbook_dir }}/../../dist/{{ tarball }}"
        dest: "/tmp/{{ tarball }}"
    
    - name: Copy installation script to remote server
      copy:
        src: "{{ playbook_dir }}/../install.py"
        dest: "/tmp/install.py"
    
    - name: Run installation script
      command: "python3 /tmp/install.py --tarball {{ tarball }} --context {{ context }} --action {{ action }}"
    
    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "/tmp/install.py"
        - "/tmp/{{ tarball }}"