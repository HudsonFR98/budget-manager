# HTTP-only Nginx configuration for Budget Manager Test Environment

upstream budget_managerapp {
    server budman_app_test:8081;
}

server {
    listen 80;
    server_name budman.test.nath-server.home;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/budget_managertest_access.log;
    error_log /var/log/nginx/budget_managertest_error.log;
    
    # Main application (including static files)
    location / {
        proxy_pass http://budget_managerapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
} 