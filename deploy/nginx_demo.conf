# HTTP-only Nginx configuration for FAIR3R Custom Overlay Demo Environment

upstream fair3r_app {
    server fair3r_custom_overlay_demo:8080;
}

server {
    listen 80;
    server_name serv-ics-fco-d-01.igbmc.u-strasbg.fr;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/fair3r_demo_access.log;
    error_log /var/log/nginx/fair3r_demo_error.log;
    
    # Static files
    location /static/ {
        alias /opt/fair3r_custom_overlay/fair3r_custom_overlay/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /favicon.ico {
        alias /opt/fair3r_custom_overlay/fair3r_custom_overlay/static/favicon.ico;
        expires 1y;
    }
    
    # Main application
    location / {
        proxy_pass http://fair3r_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
} 