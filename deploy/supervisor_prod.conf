[program:fair3r_custom_overlay]
command=/opt/env3/fair3r_custom_overlay/bin/gunicorn -t 600 -b localhost:5000 fair3r_custom_overlay_app:app
process_name=fair3r_custom_overlay
numprocs=1
directory=/opt/fair3r_custom_overlay
priority=100
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
user=web
redirect_stderr=false
stdout_logfile=/var/log/fair3r_custom_overlay/supervisor.stdout.%(process_num)s.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/var/log/fair3r_custom_overlay/supervisor.stderr.%(process_num)s.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
environment=PATH="/opt/env3/fair3r_custom_overlay/bin",FAIR3R_CUSTOM_OVERLAY_CONTEXT="prod"
