# HTTP-only Nginx configuration for Ics Standalone App Template Production Environment

upstream ics_standalone_app_templateapp {
    server sat_app_prod:8080;
}

server {
    listen 80;
    server_name serv-ics-sat-p-01.igbmc.u-strasbg.fr;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/ics_standalone_app_templateprod_access.log;
    error_log /var/log/nginx/ics_standalone_app_templateprod_error.log;
    
    # Main application (including static files)
    location / {
        proxy_pass http://ics_standalone_app_templateapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
} 