# HTTP-only Nginx configuration for FAIR3R Custom Overlay Production Environment

# HTTPS redirect to HTTP
server {
    listen 443 ssl;
    server_name serv-ics-fco-p-01.igbmc.u-strasbg.fr;
    
    # Redirect all HTTPS traffic to HTTP
    return 301 http://$server_name$request_uri;
}

upstream fair3r_app {
    server fair3r_custom_overlay_prod:8080;
}

server {
    listen 80;
    server_name serv-ics-fco-p-01.igbmc.u-strasbg.fr;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/fair3r_prod_access.log;
    error_log /var/log/nginx/fair3r_prod_error.log;
    
    # Main application (including static files)
    location / {
        proxy_pass http://fair3r_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
} 