{% extends 'base.html' %}

{% block content %}

<h4>{{ _('Add Saving') }}</h4>
<br>
<form method="POST" action="{{ url_for('saving.add') }}">
    <div class="form-group">
        <label for="name">{{ _('Name') }}</label>
        <input type="text" class="form-control" id="name" name="name" required maxlength="100">
    </div>
    <br>
    <div class="form-group">
        <label for="amount-percent">{{ _('Amount') }}<br><span style="color: gray">(en % du solde total)</span></label>
        <br>
        <input type="range" step="0.001" class="form-control-range" id="amount-percent" name="amount-percent" min="0" max="100" value="0" required>
        <span id="amount-percent-value">0</span>%
        <br>
        <label for="amount-percent"><span style="color: gray">(ou en €)</span></label>
        <input type="number" step="0.01" class="form-control" id="amount-euros" name="amount-euros" value="0" placeholder="€">
        <input type="hidden" id="amount" name="amount" value="0">
    </div>
    <br>
    <div class="form-group">
        <label for="note">{{ _('Note') }} <small class="text-muted">({{ _('optional') }})</small></label>
        <input type="text" class="form-control" id="note" name="note" maxlength="255">
    </div>
    <br>
    <div class="form-group" style="width: 100px">
        <label for="color">{{ _('Color') }}</label>
        <input type="color" class="form-control" id="color" name="color">
    </div>
    <br>
    <div class="form-group" style="width: 100px">
        <label for="icon">{{ _('Icon') }} <small class="text-muted">({{ _('optional') }})</small></label>
        <input style="font-size: 20px" type="text" class="form-control" id="icon" name="icon" placeholder="(emoji)" maxlength="30">
    </div>
    <br>
    <div class="form-group">
        <label for="goal">{{ _('Goal') }} <small class="text-muted">({{ _('optional') }})</small></label>
        <input type="number" step="0.01" class="form-control" id="goal" name="goal" placeholder="{{ _('Target amount') }}">
    </div>
    <br>
    <button type="submit" class="btn btn-primary">{{ _('Create') }}</button>
    <a href="{{ url_for('saving.summary') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
</form>

<script>
  (function() {
    // Get the range input element
    var rangePercentInput = document.getElementById('amount-percent');
    var rangeEurosInput = document.getElementById('amount-euros');
    var hiddenAmountInput = document.getElementById('amount');

    // Get the span element to display the value
    var rangePercentValue = document.getElementById('amount-percent-value');

    // Get the numeric variable from the server via Jinja
    var numericVariable = {{ total_balance }};
    
    // Ensure numericVariable is valid
    if (!numericVariable || numericVariable <= 0) {
      numericVariable = 1; // Prevent division by zero
    }

    // Initialize euros input on page load based on slider value
    function initializeEuros() {
      var percentValue = parseFloat(rangePercentInput.value) || 0;
      var eurosValue = (percentValue / 100) * numericVariable;
      rangeEurosInput.value = eurosValue.toFixed(2);
      hiddenAmountInput.value = eurosValue.toFixed(2);
    }
    
    // Initialize on page load
    initializeEuros();

    // Update the span element with the initial value
    rangePercentValue.innerHTML = parseFloat(rangePercentInput.value).toFixed(2);

    // Calculate the corresponding value in euros and update the numeric input
    rangePercentInput.addEventListener('input', function () {
      var percentValue = parseFloat(this.value) || 0;
      
      // Constrain to valid range
      if (percentValue < 0) percentValue = 0;
      if (percentValue > 100) percentValue = 100;
      
      rangePercentValue.innerHTML = percentValue.toFixed(2);
      var eurosValue = (percentValue / 100) * numericVariable;
      rangeEurosInput.value = eurosValue.toFixed(2);
      hiddenAmountInput.value = eurosValue.toFixed(2);
    });

    // Update the range input with the corresponding percentage when the numeric input changes
    rangeEurosInput.addEventListener('input', function () {
      var eurosValue = parseFloat(this.value) || 0;
      
      // If input is empty or invalid, set to 0
      if (isNaN(eurosValue) || !isFinite(eurosValue)) {
        eurosValue = 0;
        this.value = '0.00';
      }
      
      // Calculate percentage
      var percentValue = (eurosValue / numericVariable) * 100;
      
      // Constrain to valid range
      if (percentValue < 0) percentValue = 0;
      if (percentValue > 100) percentValue = 100;
      
      // Update slider and display
      rangePercentInput.value = percentValue.toFixed(4);
      rangePercentValue.innerHTML = percentValue.toFixed(2);
      hiddenAmountInput.value = eurosValue.toFixed(2);
    });
  })();
</script>

{% endblock %}
