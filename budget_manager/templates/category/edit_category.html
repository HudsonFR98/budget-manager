{% extends 'base.html' %}

{% block content %}

<h4>Modifier une catégorie</h4>
<br>
<form method="POST" action="/category/edit/{{cat.id}}">
  <div class="form-group">
    <label for="name">Nom</label>
    <input type="text" class="form-control" id="name" name="name" value="{{ cat.name }}" required>
  </div>
  <br>
  <div class="form-group">
    <label for="type-select">Type</label>
    <select class="form-control" id="type-select" name="type">
      <option value="0" {% if cat.type==0 %}selected{% endif %}>Revenus</option>
      <option value="1" {% if cat.type==1 %}selected{% endif %}>Dépenses fixes</option>
      <option value="2" {% if cat.type==2 %}selected{% endif %}>Dépenses variables</option>
    </select>
  </div>
  <br>
  <div class="form-group">
    <label for="budget-percent">Budget alloué pour ce mois<br><span style="color: gray">(en % de vos
        gains)</span></label>
    <br>
    {% if cat.get_month_budget %}
    <input type="range" step="0.001" class="form-control-range" id="budget-percent" name="budget" min="0" max="100"
      value="{{ cat.get_month_budget.amount*100 }}" required>
    <span id="budget-percent-value">{{ cat.get_month_budget.amount*100 }}</span>%
    <br>
    <label for="budget-percent"><span style="color: gray">(ou en €)</span></label>
    <input type="text" class="form-control" id="budget-euros" name="budget-euros" value="" placeholder="€">
    {% else %}
    <input type="range" step="0.001" class="form-control-range" id="budget-percent" name="budget" min="0" max="100"
      value="0" required>
    <span id="budget-percent-value">0</span>%
    <br>
    <label for="budget-percent"><span style="color: gray">(ou en €)</span></label>
    <input type="text" class="form-control" id="budget-euros" name="budget-euros" value="" placeholder="€">
    {% endif %}
  </div>
  <br>
  <div class="form-group" style="width: 100px">
    <label for="name">Couleur</label>
    <input type="color" class="form-control" id="color" name="color" value="{{ cat.color }}" required>
  </div>
  <br>
  <div class="form-group" style="width: 100px">
    <label for="name">Icone</label>
    <input style="font-size: 30px" type="text" class="form-control" id="icon" name="icon" value="{{ cat.icon }}">
  </div>
  <br>
  <button type="submit" class="btn btn-primary">Mettre à jour</button>
</form>

<script>
  (function() {
    // Get the range input element
    var rangePercentInput = document.getElementById('budget-percent');
    var rangeEurosInput = document.getElementById('budget-euros');

    // Get the span element to display the value
    var rangePercentValue = document.getElementById('budget-percent-value');

    // Get the numeric variable from the server via Jinja
    var numericVariable = {{ total_earnings }};
    
    // Ensure numericVariable is valid
    if (!numericVariable || numericVariable <= 0) {
      numericVariable = 1; // Prevent division by zero
    }

    // Initialize euros input on page load based on slider value
    function initializeEuros() {
      var percentValue = parseFloat(rangePercentInput.value) || 0;
      var eurosValue = (percentValue / 100) * numericVariable;
      rangeEurosInput.value = eurosValue.toFixed(2);
    }
    
    // Initialize on page load
    initializeEuros();

    // Update the span element with the initial value
    rangePercentValue.innerHTML = parseFloat(rangePercentInput.value).toFixed(2);

    // Calculate the corresponding value in euros and update the numeric input
    rangePercentInput.addEventListener('input', function () {
      var percentValue = parseFloat(this.value) || 0;
      
      // Constrain to valid range
      if (percentValue < 0) percentValue = 0;
      if (percentValue > 100) percentValue = 100;
      
      rangePercentValue.innerHTML = percentValue.toFixed(2);
      var eurosValue = (percentValue / 100) * numericVariable;
      rangeEurosInput.value = eurosValue.toFixed(2);
    });

    // Update the range input with the corresponding percentage when the numeric input changes
    rangeEurosInput.addEventListener('input', function () {
      var eurosValue = parseFloat(this.value) || 0;
      
      // If input is empty or invalid, set to 0
      if (isNaN(eurosValue) || !isFinite(eurosValue)) {
        eurosValue = 0;
        this.value = '0.00';
      }
      
      // Calculate percentage
      var percentValue = (eurosValue / numericVariable) * 100;
      
      // Constrain to valid range
      if (percentValue < 0) percentValue = 0;
      if (percentValue > 100) percentValue = 100;
      
      // Update slider and display
      rangePercentInput.value = percentValue.toFixed(4);
      rangePercentValue.innerHTML = percentValue.toFixed(2);
    });
  })();
</script>

{% endblock %}
