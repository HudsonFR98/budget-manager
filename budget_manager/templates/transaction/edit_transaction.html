{% extends 'base.html' %}

{% block content %}

<h4>Modifier une transaction</h4>
<br>
<form method="POST" action="/transaction/edit/{{transac.id}}">
    <div class="form-group">
        <label for="type-select">Catégorie</label>
        <select class="form-control" id="type-select" name="category">
            {% for c in categories %}
            <option {% if transac.category.id==c.id %}selected{% endif %} value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div class="form-group">
        <label for="name">Date</label>
        <input type="date" class="form-control" id="date" name="date" value="{{ transac.get_datetime }}" required>
    </div>
    <br>
    <div class="form-group">
        <label for="name">Montant</label>
        <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ transac.amount }}"
            required>
        <small class="form-text text-muted">Positif pour les revenus, négatif pour les dépenses</small>
    </div>
    <br>
    <div class="form-group">
        <label for="name">Note</label>
        <input type="text" class="form-control" id="note" name="note" value="{{ transac.note }}" required>
    </div>
    <br>
    <div class="form-group">
        <label for="saving-select">Épargne</label>
        <select class="form-control" id="saving-select" name="saving" required>
            {% for s in savings %}
            <option {% if (transac.saving_id and transac.saving_id==s.id) or (not transac.saving_id and loop.first)
                %}selected{% endif %} value="{{ s.id }}">{{ s.icon if s.icon else '' }} {{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <button type="submit" class="btn btn-primary mutate-control" {% if not can_edit_data %}disabled{% endif %}>Mettre à jour</button>
</form>

{% endblock %}
