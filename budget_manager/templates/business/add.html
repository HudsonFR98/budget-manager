{% extends 'base.html' %}

{% block content %}
<h4>{{ _('Add business') }}</h4>
<br>
<form method="POST" action="{{ url_for('business.add') }}">
    <div class="form-group">
        <label for="name">{{ _('Name') }}</label>
        <input type="text" class="form-control" id="name" name="name" required maxlength="70">
    </div>
    <br>
    <div class="form-group">
        <label for="started_on">{{ _('Start date') }}</label>
        <input type="date" class="form-control" id="started_on" name="started_on" required>
    </div>
    <br>
    <div class="form-group">
        <label for="opening_result">{{ _('Opening result') }}</label>
        <input type="number" step="0.01" class="form-control" id="opening_result" name="opening_result" value="0">
        <small class="form-text text-muted">{{ _('Result already accumulated before the first recorded transaction.') }}</small>
    </div>
    <br>
    <button type="submit" class="btn btn-primary mutate-control" {% if not can_edit_data %}disabled{% endif %}>{{ _('Create') }}</button>
    <a href="{{ url_for('business.summary') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
</form>
{% endblock %}
