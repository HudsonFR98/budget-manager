{% extends "base.html" %}

{% block body %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0"><i class="fas fa-terminal"></i> Last Test Run Output</h3>
                </div>
                <div class="card-body">
                    {% if has_output %}
                        <div class="test-output-container">
                            <pre class="test-output">{{ test_output }}</pre>
                        </div>
                    {% else %}
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            {{ test_output }}
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<style>
.test-output-container {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 0.25rem;
    padding: 1rem;
    margin-top: 1rem;
}

.test-output {
    background-color: #f8f9fa;
    border: none;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin: 0;
    color: #212529;
}

.test-output::-webkit-scrollbar {
    width: 8px;
}

.test-output::-webkit-scrollbar-track {
    background: #f1f1f1;
}

.test-output::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 4px;
}

.test-output::-webkit-scrollbar-thumb:hover {
    background: #555;
}
</style>
{% endblock %}
