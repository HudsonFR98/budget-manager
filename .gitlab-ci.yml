variables:
  FAIR3R_CUSTOM_OVERLAY_CONTEXT: test
  DB_IP: localhost
  PGPASSWORD: ph2013_x

stages:
  - install
  - test
  - build
  - demo
  - prod

install_env:
  stage: install
  script:
    - python3 deploy/install.py --action deploy --context test

pytest:
  stage: test
  script:
    - psql mci_test -h localhost -U web -f fair3r_custom_overlay/tests/reset.sql
    - FAIR3R_CUSTOM_OVERLAY_CONTEXT=test /opt/env3/fair3r_custom_overlay/bin/pytest --cov-report term --cov-report html:coverage_report --cov=fair3r_custom_overlay fair3r_custom_overlay/tests
  artifacts:
    paths:
    - coverage_report/
    expire_in: 1 week

pep8:
  stage: test
  script:
    - bash deploy/run_pep8.sh
  allow_failure: true
  artifacts:
    paths:
    - pep8.out
    expire_in: 1 week

build_sdist:
  stage: build
  script:
    - /opt/env3/fair3r_custom_overlay/bin/python setup.py sdist
  allow_failure: true
  artifacts:
    paths:
    - dist/
    expire_in: 1 week

deploy_demo:
  stage: demo
  script:
    - /opt/env3/fair3r_custom_overlay/bin/fab install --action deploy --env demo
  when: manual
  environment:
    name: staging
    url: http://serv-ics-recette:8124/

update_demo:
  stage: demo
  script:
    - /opt/env3/fair3r_custom_overlay/bin/fab install --action update --env demo
  when: manual
  environment:
    name: staging
    url: http://serv-ics-recette:8080/

deploy_prod:
  stage: prod
  script:
    - /opt/env/fair3r_custom_overlay/bin/fab install --action deploy --env prod
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fair3r_custom_overlay

update_prod:
  stage: prod
  script:
    - /opt/env/fair3r_custom_overlay/bin/fab install --action update --env prod
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fair3r_custom_overlay