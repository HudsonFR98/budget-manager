variables:
  FAIR3R_CUSTOM_OVERLAY_CONTEXT: test
  DB_IP: localhost
  PGPASSWORD: ph2013_x
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - install
  - test
  - build
  - docker
  - demo
  - prod

install_env:
  stage: install
  script:
    - python3 deploy/install.py --action deploy --context test
  tags:
    - python3

pytest:
  stage: test
  script:
    - psql fco_test -h localhost -U web -f fair3r_custom_overlay/tests/reset.sql
    - FAIR3R_CUSTOM_OVERLAY_CONTEXT=test /opt/env3/fair3r_custom_overlay/bin/pytest --cov-report term --cov-report html:coverage_report --cov=fair3r_custom_overlay fair3r_custom_overlay/tests
  artifacts:
    paths:
    - coverage_report/
    expire_in: 1 week

pep8:
  stage: test
  script:
    - bash deploy/run_pep8.sh
  allow_failure: true
  artifacts:
    paths:
    - pep8.out
    expire_in: 1 week

build_sdist:
  stage: build
  script:
    - /opt/env3/fair3r_custom_overlay/bin/python setup.py sdist
  allow_failure: true
  artifacts:
    paths:
    - dist/
    expire_in: 1 week

build_docker:
  stage: docker
  image: docker:28.1.1
  services:
    - docker:28.1.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - master
    - tags

deploy_demo:
  stage: demo
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env demo --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-ics-fco-d-01:8080/
  needs:
    - build_docker

update_demo:
  stage: demo
  script:
    - python3 deploy/ansible_deploy.py --action update --env demo --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-ics-fco-d-01:8080/
  needs:
    - build_docker

deploy_prod:
  stage: prod
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env prod --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fco-p-01
  needs:
    - build_docker

update_prod:
  stage: prod
  script:
    - python3 deploy/ansible_deploy.py --action update --env prod --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fco-p-01
  needs:
    - build_docker
