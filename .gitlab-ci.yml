variables:
  FAIR3R_CUSTOM_OVERLAY_CONTEXT: test
  DB_IP: localhost
  PGPASSWORD: ph2013_x
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - populate-proxy
  - docker
  - test
  - build
  - demo
  - prod

# Reusable job templates
.ssh_setup_template: &ssh_setup_template
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  before_script:
    - apt update && apt install -y openssh-client
    - mkdir -p ~/.ssh
    - cp /mnt/ssh/* ~/.ssh/
    - chmod 600 ~/.ssh/id_rsa
    - chmod 644 ~/.ssh/known_hosts
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
    - pip install ansible


populate_dependency_proxy:
  stage: populate-proxy
  image: docker:28.1.1
  services:
    - docker:28.1.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - echo "Populating dependency proxy with ics used images..."
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1-dind
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:16
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:latest
    - echo "Dependency proxy population completed!"
  only:
    - master
    - tags
  when: manual
  tags:
    - ics-docker

build_docker:
  stage: docker
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - docker info
    - docker build --build-arg BASE_IMAGE=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - master
    - tags
  tags:
    - ics-docker

pytest:
  stage: test
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-ics-fco-t-01
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env test --docker-image $DOCKER_IMAGE --docker-registry $CI_REGISTRY --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  environment:
    name: test
    url: http://serv-ics-fco-t-01:8080/
  needs:
    - build_docker
  tags:
    - ics-docker

pep8:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  script:
    - pip install flake8
    - flake8 fair3r_custom_overlay | tee pep8.out || true
  allow_failure: true
  artifacts:
    paths:
      - pep8.out
    expire_in: 1 week
  tags:
    - ics-docker

deploy_demo:
  stage: demo
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-ics-fco-d-01
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env demo --docker-image $DOCKER_IMAGE --docker-registry $CI_REGISTRY --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-ics-fco-d-01:8080/
  needs:
    - build_docker
  tags:
    - ics-docker

update_demo:
  stage: demo
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-ics-fco-d-01
  script:
    - python3 deploy/ansible_deploy.py --action update --env demo --docker-image $DOCKER_IMAGE --docker-registry $CI_REGISTRY --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-ics-fco-d-01:8080/
  needs:
    - build_docker
  tags:
    - ics-docker

deploy_prod:
  stage: prod
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-ics-fco-p-01
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env prod --docker-image $DOCKER_IMAGE --docker-registry $CI_REGISTRY --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fco-p-01:8080/
  needs:
    - build_docker
  tags:
    - ics-docker

update_prod:
  stage: prod
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-ics-fco-p-01
  script:
    - python3 deploy/ansible_deploy.py --action update --env prod --docker-image $DOCKER_IMAGE --docker-registry $CI_REGISTRY --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fco-p-01:8080/
  needs:
    - build_docker
  tags:
