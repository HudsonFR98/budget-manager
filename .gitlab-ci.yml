variables:
  FAIR3R_CUSTOM_OVERLAY_CONTEXT: test
  DB_IP: localhost
  PGPASSWORD: ph2013_x
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - docker
  - test
  - build
  - demo
  - prod

build_docker:
  stage: docker
  image: docker:28.1.1
  services:
    - docker:28.1.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - master
    - tags
  tags:
    - python3

pytest:
  stage: test
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env test --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  environment:
    name: test
    url: http://serv-ics-fco-t-01:8080/
  needs:
    - build_docker
  tags:
    - python3

pep8:
  stage: test
  image: python:3.10
  script:
    - pip install flake8
    - flake8 fair3r_custom_overlay | tee pep8.out || true
  allow_failure: true
  artifacts:
    paths:
      - pep8.out
    expire_in: 1 week
  tags:
    - python3

build_sdist:
  stage: build
  image: python:3.10
  script:
    - pip install build
    - python -m build --sdist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  allow_failure: true
  tags:
    - python3

deploy_demo:
  stage: demo
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env demo --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-ics-fco-d-01:8080/
  needs:
    - build_docker

update_demo:
  stage: demo
  script:
    - python3 deploy/ansible_deploy.py --action update --env demo --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-ics-fco-d-01:8080/
  needs:
    - build_docker

deploy_prod:
  stage: prod
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env prod --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fco-p-01
  needs:
    - build_docker

update_prod:
  stage: prod
  script:
    - python3 deploy/ansible_deploy.py --action update --env prod --docker --docker-image $DOCKER_IMAGE --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD
  when: manual
  environment:
    name: prod
    url: http://serv-ics-fco-p-01
  needs:
    - build_docker
