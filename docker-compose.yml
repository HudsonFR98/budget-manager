# Docker Compose file format version 3.8 for compatibility with Docker Compose 2.35.1
version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - FAIR3R_CUSTOM_OVERLAY_CONTEXT=dev
      - DB_IP=db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/opt/fair3r_custom_overlay:cached
      - app_logs:/var/log/fair3r_custom_overlay
    restart: always

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=web
      - POSTGRES_PASSWORD=fco2025_x
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fair3r_custom_overlay/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5431:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web -d fco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
