# Docker Compose file format version 3.8 for compatibility with Docker Compose 2.35.1
version: '3.8'

services:
  app:
    build: .
    container_name: sat_app_dev
    ports:
      - "8080:8080"
    environment:
      - ICS_STANDALONE_APP_TEMPLATE_CONTEXT=dev
      - DB_IP=sat_db_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/ics_standalone_app_template:cached
      - app_logs:/var/log/ics_standalone_app_template
      - backup_data:/var/backup
    restart: always
    networks:
      - sat_network_dev

  db:
    image: postgres:15
    container_name: sat_db_dev
    environment:
      - POSTGRES_USER=web
      - POSTGRES_PASSWORD=sat2025_x
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ics_standalone_app_template/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5431:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web -d sat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sat_network_dev

  redis:
    image: redis:7-alpine
    container_name: sat_redis_dev
    ports:
      - "6380:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sat_network_dev

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backups
networks:
  sat_network_dev:
    driver: bridge
