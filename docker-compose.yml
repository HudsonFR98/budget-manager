# Project name prefixes containers, volumes, and networks (e.g. budman-prod, budman-dev).
# Set BUDGET_MANAGER_CONTEXT in .env (dev, prod, validation, …).
name: "budman-${BUDGET_MANAGER_CONTEXT:-dev}"

services:
  app:
    build: .
    container_name: "budman_app_${BUDGET_MANAGER_CONTEXT:-dev}"
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      # Same value as in .env; default dev if missing (drives lib/_config.py and container names below).
      BUDGET_MANAGER_CONTEXT: ${BUDGET_MANAGER_CONTEXT:-dev}
      DB_IP: db
      PATH: /opt/env3/budget_manager/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/budget_manager:cached
      - ./logs:/var/log/budget_manager
      - ./backups:/var/backup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  db:
    image: postgres:15
    container_name: "budman_db_${BUDGET_MANAGER_CONTEXT:-dev}"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./budget_manager/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5434:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: "budman_redis_${BUDGET_MANAGER_CONTEXT:-dev}"
    ports:
      - "6381:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

networks:
  default:
    name: "budman_network_${BUDGET_MANAGER_CONTEXT:-dev}"