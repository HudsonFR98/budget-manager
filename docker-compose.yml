# Docker Compose file format version 3.8 for compatibility with Docker Compose 2.35.1
version: '3.8'

services:
  app:
    build: .
    container_name: budman_app_dev
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - BUDGET_MANAGER_CONTEXT=dev
      - DB_IP=budman_db_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/budget_manager:cached
      - ./logs:/var/log/budget_manager
      - ./backups:/var/backup
    restart: always
    networks:
      - budman_network_dev

  db:
    image: postgres:15
    container_name: budman_db_dev
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./budget_manager/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5434:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d budman" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - budman_network_dev

  redis:
    image: redis:7-alpine
    container_name: budman_redis_dev
    ports:
      - "6381:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - budman_network_dev

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backups
networks:
  budman_network_dev:
    driver: bridge
