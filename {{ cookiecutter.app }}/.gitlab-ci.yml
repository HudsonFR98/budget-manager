variables:
  {{ cookiecutter.app|upper }}_CONTEXT: test
  DB_IP: localhost
  PGPASSWORD: ph2013_x

stages:
  - install
  - test
  - build
  - demo
  - prod

install_env:
  stage: install
  script:
    - python3 deploy/deploy_test.py

pytest:
  stage: test
  script:
    - psql mci_test -h localhost -U web -f {{ cookiecutter.app }}/tests/reset.sql
    - {{ cookiecutter.app|upper }}_CONTEXT=test /opt/env3/{{ cookiecutter.app }}/bin/pytest --cov-report term --cov-report html:coverage_report --cov={{ cookiecutter.app }} {{ cookiecutter.app }}/tests
  artifacts:
    paths:
    - coverage_report/
    expire_in: 1 week

pep8:
  stage: test
  script:
    - bash deploy/run_pep8.sh
  allow_failure: true
  artifacts:
    paths:
    - pep8.out
    expire_in: 1 week

build_sdist:
  stage: build
  script:
    - /opt/env3/{{ cookiecutter.app }}/bin/python setup.py sdist
  allow_failure: true
  artifacts:
    paths:
    - dist/
    expire_in: 1 week

deploy_demo:
  stage: demo
  script:
    - /opt/env3/{{ cookiecutter.app }}/bin/fab deploy --env demo
  when: manual
  environment:
    name: staging
    url: http://serv-ics-recette:8124/

update_demo:
  stage: demo
  script:
    - /opt/env3/{{ cookiecutter.app }}/bin/fab update --env demo
  when: manual
  environment:
    name: staging
    url: http://serv-ics-recette:{{ cookiecutter.nginx_demo_port }}/

deploy_prod:
  stage: prod
  script:
    - /opt/env/{{ cookiecutter.app }}/bin/fab deploy --env prod
  when: manual
  environment:
    name: prod
    url: {{ cookiecutter.url_prod }}

update_prod:
  stage: prod
  script:
    - /opt/env/{{ cookiecutter.app }}/bin/fab update --env prod
  when: manual
  environment:
    name: prod
    url: {{ cookiecutter.url_prod }}