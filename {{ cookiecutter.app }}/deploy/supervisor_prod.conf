[program:{{ cookiecutter.app }}]
command=/opt/env3/{{ cookiecutter.app }}/bin/gunicorn -t 600 -b localhost:5000 {{ cookiecutter.app }}_app:app
process_name={{ cookiecutter.app }}
numprocs=1
directory=/opt/{{ cookiecutter.app }}
priority=100
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
user=web
redirect_stderr=false
stdout_logfile=/var/log/{{ cookiecutter.app }}/supervisor.stdout.%(process_num)s.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/var/log/{{ cookiecutter.app }}/supervisor.stderr.%(process_num)s.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
environment=PATH="/opt/env3/{{ cookiecutter.app }}/bin",{{ cookiecutter.app|upper }}_CONTEXT="prod"
