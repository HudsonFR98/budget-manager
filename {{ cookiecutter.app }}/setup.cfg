# Babel configuration
[compile_catalog]
domain = {{ cookiecutter.app }}
directory = {{ cookiecutter.app }}/i18n
statistics = true

[extract_messages]
add_comments = TRANSLATORS:
output_file = {{ cookiecutter.app }}/i18n/{{ cookiecutter.app }}.pot
width = 80

[init_catalog]
domain = {{ cookiecutter.app }}
input_file = {{ cookiecutter.app }}/i18n/{{ cookiecutter.app }}.pot
output_dir = {{ cookiecutter.app }}/i18n

[update_catalog]
domain = {{ cookiecutter.app }}
input_file = {{ cookiecutter.app }}/i18n/{{ cookiecutter.app }}.pot
output_dir = {{ cookiecutter.app }}/i18n
previous = true
